[workspace]

[package]
name = "photon-plugin-dewatermark"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Out-of-process Gemini Logo Reverse Alpha Blending & General Watermark Removal plugin for Photon"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
