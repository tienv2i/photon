[project]
name = "photon"
version = "0.1.0"
description = "Automation-first image viewer/editor — PySide6, Python 3.12, XDG portal dialogs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "jeepney>=0.9.0",
    "dbus-next>=0.2.3",
]

[project.scripts]
photon = "photon.__main__:main"
photon-ctl = "photon.automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photon"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-Pillow",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[tool.importlinter]
root_package = "photon"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core-is-pure"
type = "forbidden"
source_modules = ["photon.core", "photon.imaging"]
forbidden_modules = ["photon.ui", "photon.automation", "photon.portal", "PySide6"]

[[tool.importlinter.contracts]]
name = "automation-not-ui"
type = "forbidden"
source_modules = ["photon.automation"]
forbidden_modules = ["photon.ui.widgets"]
