[workspace]
resolver = "2"
members = [
    "crates/framework/fw-protocol",
    "crates/framework/fw-storage",
    "crates/framework/fw-runtime",
    "crates/framework/fw-ipc",
    "crates/framework/fw-cli",
    "crates/framework/fw-shell",
    "crates/framework/fw-ui",
    "crates/framework/fw-panels",
    "crates/framework/fw-dialogs",
    "crates/components/comp-file-browser",
    "crates/apps/photon/photon-protocol",
    "crates/apps/photon/photon-storage",
    "crates/apps/photon/photon-i18n",
    "crates/apps/photon/photon-image",
    "crates/apps/photon/photon-plugins",
    "crates/apps/photon/photon-ipc",
    "crates/apps/photon/photon-canvas",
    "crates/apps/photon/photon-browser",
    "crates/apps/photon/photon-viewer",
    "crates/apps/photon/photon-viewer-canvas",
    "crates/apps/photon/photon-editor",
    "crates/apps/photon/photon-cli",
    "crates/apps/photon/photon-app-common",
    "crates/apps/photon/photon-desktop",
    "crates/apps/photon/photon-app-manager",
    "crates/apps/photon/photon-app-viewer",
    "crates/apps/notes",
    "crates/apps/photon/photon-app-editor",
]

[workspace.package]
version = "0.0.5-beta"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
fw-protocol = { path = "crates/framework/fw-protocol" }
fw-storage = { path = "crates/framework/fw-storage" }
fw-runtime = { path = "crates/framework/fw-runtime" }
fw-ipc = { path = "crates/framework/fw-ipc" }
fw-cli = { path = "crates/framework/fw-cli" }
fw-shell = { path = "crates/framework/fw-shell" }
fw-ui = { path = "crates/framework/fw-ui" }
fw-panels = { path = "crates/framework/fw-panels" }
fw-dialogs = { path = "crates/framework/fw-dialogs" }
comp-file-browser = { path = "crates/components/comp-file-browser" }
photon-protocol = { path = "crates/apps/photon/photon-protocol" }
photon-storage = { path = "crates/apps/photon/photon-storage" }
photon-i18n = { path = "crates/apps/photon/photon-i18n" }
photon-image = { path = "crates/apps/photon/photon-image" }
photon-ipc = { path = "crates/apps/photon/photon-ipc" }
photon-canvas = { path = "crates/apps/photon/photon-canvas" }
photon-browser = { path = "crates/apps/photon/photon-browser" }
photon-viewer = { path = "crates/apps/photon/photon-viewer" }
photon-viewer-canvas = { path = "crates/apps/photon/photon-viewer-canvas" }
photon-editor = { path = "crates/apps/photon/photon-editor" }
photon-app-common = { path = "crates/apps/photon/photon-app-common" }

arboard = "3"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fluent-templates = "0.15"
iced = { version = "0.14", features = ["wgpu", "tiny-skia", "tokio", "image", "svg", "advanced"] }
image = { version = "0.25", features = ["avif-native"] }
jxl-oxide = "0.12"
libc = "0.2"
psd = "0.3"
rawler = "0.7"
rayon = "1.10"
resvg = "0.45"
rfd = "0.18"
roxmltree = "0.20"
schemars = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
unic-langid = "0.9"
usvg = "0.45"
xmlwriter = "0.1"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"
lto = "thin"
